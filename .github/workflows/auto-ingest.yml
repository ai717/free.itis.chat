name: Auto Ingest Resource from Agent / Issue

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process-submission:
    # Only run when labeled with 'auto-ingest' or 'resource-submission'
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.labels.*.name, 'auto-ingest') ||
        contains(github.event.issue.labels.*.name, 'resource-submission') ||
        startsWith(github.event.issue.title, '[New Resource]')
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest Issue Payload
        id: ingest
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -c "import os; open('/tmp/issue_payload.txt', 'w', encoding='utf-8').write(os.environ.get('ISSUE_BODY', ''))"
          python scripts/ingest.py --file /tmp/issue_payload.txt

      - name: Commit and Push Changes
        if: steps.ingest.outcome == 'success'
        run: |
          git config --global user.name "itis-free-bot"
          git config --global user.email "bot@itis.chat"
          git add src/content/resources/
          if git diff --staged --quiet; then
            echo "No new resources were added (already up-to-date or duplicate)."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "feat(ingest): auto-ingest new resources from agent issue #${{ github.event.issue.number }}"
            git pull --rebase origin main
            git push origin main
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Comment and Close Issue
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const ingestSuccess = '${{ steps.ingest.outcome }}' === 'success';
            const hasChanges = process.env.HAS_CHANGES === 'true';
            let message = '';
            
            if (!ingestSuccess) {
              message = '❌ **入库校验失败**：提交的资源格式不符合契约要求，或未通过三层安全审计（如缺少真避坑指南、包含反敷衍黑名单词汇或 JSON 语法错误）。请查阅仓库 Actions 运行日志修复后重试。';
            } else if (hasChanges) {
              message = '🎉 **入库成功！** 提交的资源已自动通过三层审计与全库去重校验，并已合并至主干。GitHub Pages 正在自动构建部署至 [free.itis.chat](https://free.itis.chat/)！';
            } else {
              message = 'ℹ️ **处理完成**：检测到提交的资源已存在于全库 15,700+ 项目中，或已增量合并，无需重复入库。';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

            if (ingestSuccess) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
